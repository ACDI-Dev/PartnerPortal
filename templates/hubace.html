<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE - ACDI Customer Support Expert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='ACDI_Logosmall.png') }}" alt="ACDI Logo" height="20">
        </div>
        <div class="nav-links">
            <a href="https://portal.oneacdi.com" target="_blank">Return to ACDI Portal</a>
        </div>
    </header>

    <div id="layout-wrapper">
        <main id="chat-container"></main>
    </div>

  
	<script>
document.addEventListener('DOMContentLoaded', function() {
    (function(d, t) {
        var v = d.createElement(t), s = d.getElementsByTagName(t)[0];

        {% if is_impersonating %}
        // Payload when in Impersonate Mode using the impersonated user's data
        var launchPayload = {
            Account_Category: {{ user.get('account_category', '') | tojson }},
            Account_Sub_Category: {{ user.get('tier', 'Standard') | tojson }},
            Email: {{ user.get('email', '') | tojson }},
            First_Name: {{ user.get('first_name', '') | tojson }},
            Last_Name: {{ user.get('last_name', '') | tojson }},
            Account: {{ user.get('account', '') | tojson }},
            Account_ID: {{ user.get('account_id', '') | tojson }}
        };
        {% else %}
        // Default launch payload when NOT impersonating
        var launchPayload = {
            token: '{{ token }}'
        };
        {% endif %}

        v.onload = function() {
            window.voiceflow.chat.load({
                verify: { projectID: '6a6909ff3629ffc3b501836a' },
                url: 'https://general-runtime.voiceflow.com',
                assistant: {
                    persistence: 'memory'
                },
                render: {
                    mode: 'embedded',
                    target: document.getElementById('chat-container')
                },
                autostart: true,
                launch: {
                    event: {
                        type: 'launch',
                        payload: launchPayload
                    }
                }
            });
        }
        v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
        v.type = "text/javascript";
        s.parentNode.insertBefore(v, s);
    })(document, 'script');
});
    </script>
	
</body>
</html>
