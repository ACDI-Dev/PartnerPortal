{% extends "layout.html" %}

{% block content %}
<!-- Google Cloud Gen App Builder Scripts & Widget -->
<script src="https://cloud.google.com/ai/gen-app-builder/client?hl=en_US"></script>
<gen-search-widget
  configId="ef59d8d2-c7f9-4f36-9cb6-c8a449159b39"
  triggerId="searchWidgetTrigger">
</gen-search-widget>

<!-- ACDI Branded Hero Section -->
<section class="mb-10">
    <div class="bg-acdi-dark rounded-2xl p-8 md:p-12 flex flex-col md:flex-row items-center justify-between shadow-lg relative overflow-hidden">
        
        <!-- Decorative Green Glow -->
        <div class="absolute top-0 right-0 w-96 h-96 bg-acdi-green rounded-full mix-blend-overlay filter blur-[100px] opacity-20 transform translate-x-1/3 -translate-y-1/3"></div>

        <div class="max-w-3xl relative z-10">
            <h1 class="text-4xl font-bold text-white mb-4 font-sans tracking-tight">
                ACDI <strong class="text-acdi-green">Resource Hub 2.0</strong>
            </h1>
            <p class="text-lg text-gray-300 mb-6 font-sans leading-relaxed">
                Powered by AI. Type directly into the search bar to find deployment guides, battlecards, and marketing assets.
            </p>
        </div>
        
        <!-- Hero Logo Image -->
        <div class="hidden md:flex relative z-10 p-4">
            <img src="{{ url_for('static', filename='ACDI_Logo180.png') }}" alt="ACDI Icon" class="w-40 h-40 object-contain drop-shadow-xl">
        </div>
    </div>
</section>

<!-- AI Search & Filter Section -->
<section class="mb-12">


    <!-- AI Search Input -->
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <label for="searchWidgetTrigger" class="block text-sm font-bold text-gray-900 mb-2">AI Search</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <!-- The trigger input required by the widget -->
            <input 
                type="text" 
                id="searchWidgetTrigger" 
                placeholder="Ask a question or search for a document..." 
                class="block w-full pl-10 pr-3 py-4 border border-gray-300 rounded-lg leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-2 focus:ring-acdi-green focus:border-acdi-green sm:text-lg transition-all"
            />
        </div>
        <p class="mt-2 text-sm text-gray-500">The search widget will automatically open when you interact with the search bar.</p>
    </div>
</section>


{% endblock %}
