<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>ACDI PaperCut MF Card Script Tester</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="msapplication-TileColor" content="#00a300">
  <meta name="theme-color" content="#ffffff">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Core CodeMirror Engine -->
  <script src={{ url_for('static', filename='codemirror.js') }}></script>

  <style>
    /* Essential CodeMirror Structural Rules */
    .CodeMirror {
      position: relative;
      overflow: hidden;
      height: 380px !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5 !important;
      background-color: #0f172a !important; /* Slate 900 */
      color: #f8fafc !important; /* Slate 50 */
      border-bottom-left-radius: 0.75rem;
      border-bottom-right-radius: 0.75rem;
    }
    .CodeMirror-scroll {
      overflow: scroll !important;
      margin-bottom: -30px; 
      margin-right: -30px;
      padding-bottom: 30px;
      height: 100%;
      outline: none;
      position: relative;
    }
    .CodeMirror-sizer {
      position: relative;
      border-right: 30px solid transparent;
    }
    .CodeMirror-vscrollbar, .CodeMirror-hscrollbar, .CodeMirror-scrollbar-filler, .CodeMirror-gutter-filler {
      position: absolute;
      z-index: 6;
      display: none;
    }
    .CodeMirror-lines { cursor: text; min-height: 1px; padding: 8px 0; }
    .CodeMirror pre {
      padding: 0 8px;
      border-width: 0;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      margin: 0;
      white-space: pre;
      word-wrap: normal;
      line-height: inherit;
      color: inherit;
      z-index: 2;
      position: relative;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
    }
    .CodeMirror-measure { position: absolute; width: 100%; height: 0; overflow: hidden; visibility: hidden; }
    .CodeMirror-cursor {
      position: absolute;
      pointer-events: none;
      border-left: 2px solid #38bdf8 !important;
      border-right: none;
      width: 0;
    }
    div.CodeMirror-cursors {
      visibility: hidden;
      position: relative;
      z-index: 3;
    }
    .CodeMirror-focused div.CodeMirror-cursors { visibility: visible; }
    .CodeMirror-selected { background-color: #334155 !important; }
    .CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection { background: #334155 !important; }
  </style>

  <script defer data-domain="acdiscripttest.tiiny.co" src="https://analytics.tiiny.site/js/plausible.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navigation Bar -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-4">
      <div class="bg-white p-2 rounded-md shadow-sm">
        <img src="https://portal.oneacdi.com/static/ACDI_Logosmall.png" alt="ACDI Logo" class="h-8 object-contain">
      </div>
      <h1 class="text-xl font-bold text-slate-100 hidden sm:block">PaperCut MF Card Script Tester</h1>
    </div>
    <div>
      <a href="nothing.html" id="link" download="card.js" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-4 py-2 rounded-lg border border-slate-600 transition-colors duration-200">
        Download card.js
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl w-full mx-auto p-4 flex flex-col gap-4">

    <!-- Top Section: Testing Output Window -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden flex flex-col">
      <div class="bg-slate-800/80 px-4 py-2 border-b border-slate-700 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Testing Output Window</span>
        <span class="text-xs text-slate-500">Live Preview</span>
      </div>
      <div id="iframecontainer" class="h-44 bg-white w-full">
        <div id="iframewrapper" class="w-full h-full"></div>
      </div>
    </section>

    <!-- Bottom Section: Script Editor -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg flex flex-col">
      <div class="px-4 py-3 border-b border-slate-700 flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-sm font-medium text-slate-300 flex items-center flex-wrap gap-2">
          <span>Copy text of card script between the <code class="text-emerald-400">&lt;script&gt;</code> tags below, then click</span>
          <button id="runbtn" onclick="submitTryit();" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-1.5 rounded-lg transition-colors duration-200 inline-flex items-center shadow-sm text-sm">
            <span>Run</span>
            <svg class="w-3.5 h-3.5 ml-1 fill-current" viewBox="0 0 20 20">
              <path d="M4.5 2.677v14.646a.5.5 0 00.757.429l11-7.323a.5.5 0 000-.858l-11-7.323a.5.5 0 00-.757.429z" />
            </svg>
          </button>
        </h2>
      </div>

      <!-- Hidden Helper Inputs -->
      <textarea autocomplete="off" id="textareaCodepre" spellcheck="false" class="hidden">
<!DOCTYPE html>
<html>
<body>
<script>
function ConvertCardString() {
  var cardstring = document.getElementById('cardnumb').value;
  document.getElementById("demo").innerHTML = convert(cardstring);
}
</script>
      </textarea>

      <!-- Main Script Area -->
      <div class="p-2 bg-slate-900/50 rounded-b-xl">
        <textarea autocomplete="off" id="textareaCode" spellcheck="false"><script>
function convert(cardNumber){

 //Pad Zeros

var numberofdigits = 5; // 0 - No padding  example: 5 would pad 457 to 00457


 return padzero(cardNumber,numberofdigits);

 }

 function padzero(num, size) {

    var s = num+"";

    while (s.length < size) {s = "0" + s;}

    return s;

}
</script></textarea>
      </div>

      <textarea autocomplete="off" id="textareaCodepost" spellcheck="false" class="hidden">
<div style="font-family: system-ui, -apple-system, sans-serif; padding: 20px; color: #334155;">
    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Card Number Before Script:</label>
    <input type="text" id="cardnumb" name="cardnumb" style="border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; font-size: 15px;">
    <button type="button" onclick="ConvertCardString()" style="background-color: #8dc53e; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">Convert Card String</button>
    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Card Number After Script:</label>
    <span id="demo" style="display: inline-block; min-width: 120px; min-height: 20px; padding: 6px 10px; background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: bold; color: #059669;"></span>
</div>
</body>
</html>
      </textarea>
    </section>
  </main>

  <script>
    submitTryit();

    function submitTryit() {
      if (window.editor) {
        window.editor.save();
      }
     
      var text = document.getElementById("textareaCodepre").value + 
                 document.getElementById("textareaCode").value + 
                 document.getElementById("textareaCodepost").value;

      var ifr = document.createElement("iframe");
      ifr.setAttribute("frameborder", "0");
      ifr.setAttribute("id", "iframeResult");
      ifr.setAttribute("name", "iframeResult");  
      ifr.setAttribute("allowfullscreen", "true");  
      ifr.className = "w-full h-full border-0";

      document.getElementById("iframewrapper").innerHTML = "";
      document.getElementById("iframewrapper").appendChild(ifr);
        
      var ifrw = (ifr.contentWindow) ? ifr.contentWindow : (ifr.contentDocument.document) ? ifr.contentDocument.document : ifr.contentDocument;
      ifrw.document.open();
      ifrw.document.write(text);
      ifrw.document.close();

      if (ifrw.document.body && !ifrw.document.body.isContentEditable) {
        ifrw.document.body.contentEditable = true;
        ifrw.document.body.contentEditable = false;
      }
    }

    function colorcoding() {
      var ua = navigator.userAgent;
      if (ua && ua.toUpperCase().indexOf("OPERA MINI") > -1) { return false; }
      window.editor = CodeMirror.fromTextArea(document.getElementById("textareaCode"), {
        mode: "text/html",
        lineWrapping: true,
        smartIndent: false,
        htmlMode: true,
        autocorrect: false,      
        addModeClass: true
      });

      setTimeout(function() {
        if (window.editor) {
          window.editor.refresh();
        }
      }, 50);
    }

    colorcoding();

    function downloadCode(link, code) {
      link.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(code);
    }

    document.getElementById('link').addEventListener('click', function () {
      downloadCode(this, textareaCode.value.replace('<script>','').replace('<\/script>','').trim());
    }, false);
  </script>
</body>
</html>
