{% extends "layout.html" %}

{% block title %}Claim - ACDI Partner Perks{% endblock %}

{% block content %}
<!-- Include the centralized Partner Perks Navigation -->
{% include "perks/_nav.html" %}

<style>
    .required:after {
        content: " *";
        color: #ef4444; 
    }
</style>

<section class="mb-8">
    <div class="flex items-center gap-2 mb-6">
        <div class="w-2 h-6 bg-acdi-green rounded-sm"></div>
        <h2 class="text-2xl font-bold text-gray-900 font-sans">Submit a Claim</h2>
    </div>
</section>

<section class="mb-12">
    <form id="claimForm" method="post" action="/claim/review">    
        <!-- Hidden Inputs -->
        <input type="hidden" id="code" name="code" value="6a8dc0f4a0308" />    
        <input type="hidden" id="filesCode" name="filesCode" value="6a8dc0f4a0308" />    
        <input type="hidden" id="mode" name="mode" value="new" />    
        <input type="hidden" id="offer_promotion_id" name="offer_promotion_id" value="1" />    
        <input type="hidden" id="claim_id" name="claim_id" value="new" />    
        <input type="hidden" id="created_at" name="created_at" value="" />    
        <input type="hidden" id="maxParticipants" name="maxParticipants" value="1" />    
        <input type="hidden" id="maxLineitems" name="maxLineitems" value="-1" />    
        <input type="hidden" name="_token" value="Xzb4AOsvU4WpusixeNYyo5MWmUKZv0iSOwyffrLJ">    
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-xl font-bold text-gray-900">Claim Details</h3>
            </div>
            
            <div class="p-6 md:p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="claimExternalFields">    
                    
                    <div class="space-y-5">                                    
                        <div>    
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="customer_contact_first">Contact First Name</label>    
                            <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-gray-50 text-gray-500 cursor-not-allowed" id="customer_contact_first" name="customer_contact_first" value="{{ user.get('first_name', '') }} " disabled>                    
                        </div>                                                
                        
                        <div>    
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="customer_contact_last">Contact Last Name</label>    
                            <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-gray-50 text-gray-500 cursor-not-allowed" id="customer_contact_last" name="customer_contact_last" value="{{ user.get('last_name', '') }}" disabled>                    
                        </div>                                                
                        
                        <div>    
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="customer_contact_email">Contact Email</label>    
                            <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-gray-50 text-gray-500 cursor-not-allowed" id="customer_contact_email" name="customer_contact_email" value="{{ user.get('email', '') }}" disabled>                    
                        </div>                                                
                         
                        <div>    
                            <label class="block text-sm font-medium text-gray-700 mb-1 required" for="customer_name">End User Company</label>    
                            <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white" id="customer_name" name="customer_name" value="" required>                    
                        </div>                                                                                    
                    </div>    
                    
                    <div class="space-y-5">                                                                                                
                        <div>   					
                            <label class="block text-sm font-medium text-gray-700 mb-1 required" for="activity_date">Date of Sale</label>    
                            <input autocomplete="off" type="date" max="{{ max_date }}" min="{{ min_date }}" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white" id="activity_date" name="activity_date" value="" required>                
                        </div>                                                
                        
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mt-2 space-y-4">
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">* Provide at least one order number</p>
                            
                            <div>    
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="prm_number">ACDI Sales Order Number</label>    
                                <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white" id="prm_number" name="prm_number" value="">                    
                            </div>                                                
                            
                            <div>    
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="distributor_po_number">Company PO Number</label>    
                                <input type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white" id="distributor_po_number" name="distributor_po_number" value="">                    
                            </div>
                        </div>
                        
                        <div class="pt-2">
                            <div class="flex items-center">
                                <input type="checkbox" id="split_points_checkbox" name="split_points_checkbox" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded cursor-pointer"> 
                                <label for="split_points_checkbox" class="ml-2 block text-sm font-bold text-gray-900 cursor-pointer">
                                    I want to halve points with another user
                                </label>
                            </div>
                        </div>
                        
                        <div id="email_shared_points_container" style="display: none;">  
                            <label class="block text-sm font-medium text-gray-700 mb-1" id="email_shared_points_label" for="email_shared_points">Halve Points - Colleague's Email</label>    
                            <input type="email" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white" id="email_shared_points" name="email_shared_points" value="" placeholder="Enter colleague's email">                    
                        </div>   							
                    </div>
                </div>
            </div>    
        </div>
        
        <div class="mt-8 flex justify-end gap-4">        
            <a href="{{ url_for('perks_home') }}" class="inline-flex items-center px-6 py-3 border border-gray-300 shadow-sm text-base font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors">
                Cancel
            </a>        
            <button type="submit" id="review" class="inline-flex items-center px-6 py-3 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-acdi-green hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                Submit Claim
            </button>    
        </div>    
    </form>
</section>

<!-- Form Logic Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const splitCheckbox = document.getElementById('split_points_checkbox');
    const emailContainer = document.getElementById('email_shared_points_container');
    const emailInput = document.getElementById('email_shared_points');
    const emailLabel = document.getElementById('email_shared_points_label');

    splitCheckbox.addEventListener('change', function() {
        if (this.checked) {
            emailContainer.style.display = 'block';
            emailInput.required = true;
            emailLabel.classList.add('required');
        } else {
            emailContainer.style.display = 'none';
            emailInput.required = false;
            emailInput.value = ''; 
            emailLabel.classList.remove('required');
        }
    });

    const prmNumber = document.getElementById('prm_number');
    const poNumber = document.getElementById('distributor_po_number');

    function validateOrderNumbers() {
        if (prmNumber.value.trim() === '' && poNumber.value.trim() === '') {
            const errorMsg = 'Please provide either an ACDI Sales Order Number or a Company PO Number.';
            prmNumber.setCustomValidity(errorMsg);
            poNumber.setCustomValidity(errorMsg);
        } else {
            prmNumber.setCustomValidity('');
            poNumber.setCustomValidity('');
        }
    }

    prmNumber.addEventListener('input', validateOrderNumbers);
    poNumber.addEventListener('input', validateOrderNumbers);
    validateOrderNumbers();
});
</script>
{% endblock %}
