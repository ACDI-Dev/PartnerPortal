<!-- Global Perks Loading Overlay -->
<div id="perksLoadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden transition-opacity">
    <svg class="animate-spin h-12 w-12 text-acdi-green mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span class="text-lg font-bold text-gray-800 tracking-wide">Loading...</span>
</div>

<!-- Script to handle Nav Clicks -->
<script>
document.addEventListener('DOMContentLoaded', function() {
        const navLinks = document.querySelectorAll('#perks-nav a');
        const overlay = document.getElementById('perksLoadingOverlay');

        if (!overlay) return;

        navLinks.forEach(function(link) {
            link.addEventListener('click', function(e) {
                if (link.target !== '_blank' && !e.ctrlKey && !e.metaKey) {
                    overlay.classList.remove('hidden');
                }
            });
        });

        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                overlay.classList.add('hidden');
            }
        });
});
</script>
