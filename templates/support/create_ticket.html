{% extends "layout.html" %}

{% block content %}
{% include "support/support_tools_nav.html" %}

<section class="max-w-3xl mx-auto mb-8 sm:mb-12 px-2 sm:px-0">
    <div class="flex items-center gap-2 mb-4 sm:mb-6">
        <div class="w-2 h-6 bg-acdi-green rounded-sm"></div>
        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 font-sans">Create a Support Ticket</h2>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 md:p-8">
        <div id="statusAlert" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

        <form id="ticketForm" onsubmit="submitTicketForm(event)" class="space-y-5 sm:space-y-6">

            <!-- Compact Readonly User Summary -->
            <div class="bg-gray-50 p-3 sm:p-4 rounded-xl border border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs sm:text-sm text-gray-600">
                <div>
                    <span class="font-bold text-gray-800">{{ user.first_name|default('') }} {{ user.last_name|default('') }}</span>
                    <span class="text-gray-400 mx-1">•</span>
                    <span>{{ user.email|default('') }}</span>
                </div>
                <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded font-mono">Submitting User</span>
            </div>

            <!-- Subject & CRN Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Ticket Subject <span class="text-red-500">*</span></label>
                    <input type="text" name="ticket_subject" required placeholder="Brief summary of the issue" class="w-full border border-gray-300 focus:ring-acdi-green focus:border-acdi-green rounded-lg p-3 text-base sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">CRN <span class="text-xs text-gray-400 font-normal">(Optional)</span></label>
                    <input type="text" name="CRN" value="{{ default_crn }}" placeholder="e.g. C-12345" class="w-full border border-gray-300 focus:ring-acdi-green focus:border-acdi-green rounded-lg p-3 text-base sm:text-sm font-mono">
                </div>
            </div>

            <!-- Product Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Product Involved <span class="text-red-500">*</span></label>
                <select name="Product_Involved" required class="w-full border border-gray-300 focus:ring-acdi-green focus:border-acdi-green rounded-lg p-3 text-base sm:text-sm bg-white">
                    <option value="" disabled selected>Select a product...</option>
                    <option value="PaperCut MF">PaperCut MF</option>
                    <option value="PaperCut Hive">PaperCut Hive</option>
                    <option value="PaperCut NG">PaperCut NG</option>
                    <option value="Umango">Umango</option>
                    <option value="Print Deploy">Print Deploy</option>
                    <option value="Hardware / Terminals">Hardware / Terminals</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Issue Description <span class="text-red-500">*</span></label>
                <textarea name="description" rows="4" required placeholder="Provide details about the issue, error messages, and troubleshooting steps taken..." class="w-full border border-gray-300 focus:ring-acdi-green focus:border-acdi-green rounded-lg p-3 text-base sm:text-sm"></textarea>
            </div>

            <!-- Mobile Sticky / Full-width Submit Buttons -->
            <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-2">
                <a href="{{ url_for('support.support_tools') }}" class="w-full sm:w-auto text-center px-5 py-3 sm:py-2.5 rounded-lg text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">Cancel</a>
                <button type="submit" id="submitBtn" class="w-full sm:w-auto justify-center px-6 py-3 sm:py-2.5 rounded-lg text-sm font-bold text-acdi-dark bg-acdi-green hover:bg-opacity-90 transition-colors flex items-center gap-2">
                    <span id="btnText">Submit Ticket</span>
                    <svg id="btnSpinner" class="animate-spin h-4 w-4 text-acdi-dark hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</section>

<script>
function submitTicketForm(event) {
    event.preventDefault();

    const form = document.getElementById('ticketForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBox = document.getElementById('statusAlert');

    submitBtn.disabled = true;
    btnText.textContent = 'Submitting...';
    btnSpinner.classList.remove('hidden');

    const formData = new FormData(form);

    fetch("{{ url_for('support.create_ticket') }}", {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');

        if (data.status === 'success') {
            alertBox.className = 'mb-6 p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800';
            alertBox.textContent = data.message;
            form.reset();
            setTimeout(() => {
                window.location.href = "/support-tools";
            }, 2000);
        } else {
            throw new Error(data.message || 'Failed to submit ticket.');
        }
    })
    .catch(error => {
        alertBox.className = 'mb-6 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800';
        alertBox.textContent = error.message || 'An unexpected error occurred.';
    })
    .finally(() => {
        submitBtn.disabled = false;
        btnText.textContent = 'Submit Ticket';
        btnSpinner.classList.add('hidden');
    });
}
</script>
{% endblock %}
