{% extends "layout.html" %}

{% block content %}
<!-- ACDI Branded Hero Section -->
<section class="mb-10">
    <div class="bg-acdi-dark rounded-2xl p-8 md:p-12 flex flex-col md:flex-row items-center justify-between shadow-lg relative overflow-hidden">
        
        <!-- Decorative Green Glow -->
        <div class="absolute top-0 right-0 w-96 h-96 bg-acdi-green rounded-full mix-blend-overlay filter blur-[100px] opacity-20 transform translate-x-1/3 -translate-y-1/3"></div>

        <div class="max-w-3xl relative z-10">
            <h1 class="text-4xl font-bold text-white mb-4 font-sans tracking-tight">
                ACDI <strong class="text-acdi-green">Resource Hub</strong>
            </h1>
            <p class="text-lg text-gray-300 mb-6 font-sans leading-relaxed">
                Access battlecards, technical datasheets, co-branded marketing assets, and deployment guides. Filter by product, language, or category below to find exactly what you need.
            </p>
        </div>
        
        <!-- Hero Logo Image -->
        <div class="hidden md:flex relative z-10 p-4">
            <img src="{{ url_for('static', filename='ACDI_Logo180.png') }}" alt="ACDI Icon" class="w-40 h-40 object-contain drop-shadow-xl">
        </div>
    </div>
</section>

<!-- Filter Section -->
<section class="mb-8">
    <!-- Product Logo Grid (Wrapped) -->
    <div class="mb-6">
        <h3 class="text-sm font-medium text-gray-700 mb-3 uppercase tracking-wide">Filter by Product</h3>
        
        <div class="flex flex-wrap gap-4 py-2 items-center" id="logoCarousel">
            <button data-product="All" class="product-btn h-16 px-6 bg-white border-2 border-acdi-green rounded-xl shadow-sm hover:shadow-md transition-all flex items-center justify-center min-w-[120px]">
                <span class="font-bold text-gray-800">All Products</span>
            </button>
            <button data-product="ACDI" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='ACDI.webp') }}" alt="ACDI" class="max-h-full object-contain">
            </button>
            <button data-product="PaperCut" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='PaperCut.webp') }}" alt="PaperCut" class="max-h-full object-contain">
            </button>
            <button data-product="Scanshare" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='Scanshare.webp') }}" alt="Scanshare" class="max-h-full object-contain">
            </button>
            <button data-product="KPAX" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='KPAX.webp') }}" alt="KPAX" class="max-h-full object-contain">
            </button>
            <button data-product="Intuitive" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='Intuitive.webp') }}" alt="Intuitive" class="max-h-full object-contain">
            </button>
            <button data-product="Hardware" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='ACDI Hardware.webp') }}" alt="ACDI Hardware" class="max-h-full object-contain">
            </button>
            <button data-product="Elatec" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='Elatec.webp') }}" alt="Elatec" class="max-h-full object-contain">
            </button>
            <button data-product="RFIdeas" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='RFIdeas.webp') }}" alt="rf IDEAS" class="max-h-full object-contain">
            </button>
            <button data-product="Energy" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='ACDI Energy.webp') }}" alt="ACDI Energy" class="max-h-full object-contain">
            </button>
            <button data-product="EZ Meter" class="product-btn h-16 w-32 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-acdi-green transition-all flex items-center justify-center p-2">
                <img src="{{ url_for('static', filename='EZ Meter.webp') }}" alt="EZ Meter" class="max-h-full object-contain">
            </button>
        </div>
    </div>

    <!-- Search & Language Filters -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200 items-end shadow-sm">
        <!-- Search -->
        <div class="md:col-span-3">
            <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-1">Search Resources</label>
            <input type="text" id="searchInput" placeholder="Search by document name..." class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white">
        </div>

        <!-- Language Filter -->
        <div>
            <label for="languageFilter" class="block text-sm font-medium text-gray-700 mb-1">Language</label>
            <select id="languageFilter" class="w-full border-gray-300 rounded-md shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm p-2 border outline-none bg-white">
                <option value="All">All Languages</option>
                <option value="English" selected>English</option>
                <option value="Spanish">Spanish</option>
                <option value="Portuguese">Portuguese</option>
                <option value="French">French</option>
            </select>
        </div>
    </div>
</section>

<!-- Resource Grid -->
<section class="mb-12">
    <div class="flex items-center gap-2 mb-6">
        <div class="w-2 h-6 bg-acdi-green rounded-sm"></div>
        <h2 class="text-2xl font-bold text-gray-900 font-sans" id="resultsCount">Loading Resources...</h2>
    </div>

    <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Cards injected via JavaScript -->
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let resources = [];
    let selectedCategory = 'All'; // Track active carousel selection
    
    const grid = document.getElementById('resourceGrid');
    const searchInput = document.getElementById('searchInput');
    const languageFilter = document.getElementById('languageFilter');
    const countText = document.getElementById('resultsCount');
    const productBtns = document.querySelectorAll('.product-btn');

    // Pre-map the logo URLs so JavaScript can use them safely
    const logoUrls = {
        'ACDI': "{{ url_for('static', filename='ACDI.webp') }}",
        'PaperCut': "{{ url_for('static', filename='PaperCut.webp') }}",
        'Scanshare': "{{ url_for('static', filename='Scanshare.webp') }}",
        'KPAX': "{{ url_for('static', filename='KPAX.webp') }}",
        'Intuitive': "{{ url_for('static', filename='Intuitive.webp') }}",
        'Hardware': "{{ url_for('static', filename='ACDI Hardware.webp') }}",
        'Elatec': "{{ url_for('static', filename='Elatec.webp') }}",
        'RFIdeas': "{{ url_for('static', filename='RFIdeas.webp') }}",
        'Energy': "{{ url_for('static', filename='ACDI Energy.webp') }}",
        'EZ Meter': "{{ url_for('static', filename='EZ Meter.webp') }}"
    };

    // Fetch the JSON list from the static folder
    fetch("{{ url_for('static', filename='resources.json') }}")
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            resources = data;
            renderResources(); // Render once data is loaded (Defaults to English)
        })
        .catch(error => {
            console.error('Error loading resources:', error);
            grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-8 font-bold">Failed to load resources. Please ensure resources.json is in your static folder.</div>`;
            countText.innerText = '0 Resources';
        });

    // Product Filter Click Logic
    productBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // Remove active visual state from all buttons
            productBtns.forEach(b => {
                b.classList.remove('border-2', 'border-acdi-green');
                b.classList.add('border', 'border-gray-200');
            });
            
            // Add active visual state to clicked button
            btn.classList.remove('border', 'border-gray-200');
            btn.classList.add('border-2', 'border-acdi-green');
            
            // Update filter state and re-render
            selectedCategory = btn.getAttribute('data-product');
            renderResources();
        });
    });

    function renderResources() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedLang = languageFilter.value;

        // Apply filters against the structured JSON data
        const filtered = resources.filter(res => {
            // 1. Search Filter
            const matchesSearch = res.DisplayName.toLowerCase().includes(searchTerm) || res.url.toLowerCase().includes(searchTerm);
            
            // 2. Product Filter
            let matchesCategory = false;
            if (selectedCategory === 'All') {
                matchesCategory = true;
            } else if (selectedCategory === 'EZ Meter') {
                matchesCategory = res.Product === 'Energy' && res.DisplayName.toLowerCase().includes('ez meter');
            } else if (selectedCategory === 'Elatec') {
                matchesCategory = res.Product === 'Hardware' && res.DisplayName.toLowerCase().includes('elatec');
            } else if (selectedCategory === 'RFIdeas') {
                matchesCategory = res.Product === 'Hardware' && (res.DisplayName.toLowerCase().includes('rf ideas') || res.DisplayName.toLowerCase().includes('rfideas'));
            } else {
                matchesCategory = res.Product === selectedCategory;
            }

            // 3. Language Filter (Defaults to English via HTML attribute)
            const matchesLang = selectedLang === 'All' || res.Language === selectedLang;
            
            return matchesSearch && matchesCategory && matchesLang;
        });

        countText.innerText = `Showing ${filtered.length} Resource${filtered.length !== 1 ? 's' : ''}`;
        grid.innerHTML = '';

        // Render card markup
        filtered.forEach(res => {
            // Determine which exact logo to display for this file
            let logoKey = res.Product;
            const nameLower = res.DisplayName.toLowerCase();
            
            if (res.Product === 'Energy' && nameLower.includes('ez meter')) {
                logoKey = 'EZ Meter';
            } else if (res.Product === 'Hardware') {
                if (nameLower.includes('elatec')) logoKey = 'Elatec';
                else if (nameLower.includes('rf ideas') || nameLower.includes('rfideas')) logoKey = 'RFIdeas';
            }
            
            // Fallback to ACDI if product isn't explicitly mapped
            const logoUrl = logoUrls[logoKey] || logoUrls['ACDI'];

            const card = document.createElement('a');
            card.href = res.url;
            card.target = "_blank";
            card.className = "block p-6 bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-lg hover:-translate-y-1 hover:border-acdi-green transition-all duration-200 group flex flex-col justify-between h-full";
            
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 bg-gray-50 group-hover:bg-[#f0f9e8] rounded-lg flex items-center justify-center p-2 transition-colors">
                            <img src="${logoUrl}" alt="${res.Product}" class="w-full h-full object-contain">
                        </div>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                            ${res.Language}
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2 leading-snug group-hover:text-acdi-green transition-colors">${res.DisplayName}</h3>
                </div>
                <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-500 uppercase tracking-wide">${res.Product}</span>
                    <svg class="w-4 h-4 text-gray-400 group-hover:text-acdi-green transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Event Listeners for standard dropdowns/inputs
    searchInput.addEventListener('input', renderResources);
    languageFilter.addEventListener('change', renderResources);
});
</script>
{% endblock %}
