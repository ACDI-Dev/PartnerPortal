<!-- Sub-Navigation Menu -->
<section class="mb-6">
    <nav class="flex items-center gap-1 bg-white p-2 rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
        <!-- Back to Main Dashboard -->
        <a href="{{ url_for('main.dashboard') }}" class="whitespace-nowrap px-4 py-2 text-sm font-medium text-gray-600 hover:text-acdi-green hover:bg-gray-50 rounded-lg transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Dashboard
        </a>

        <div class="w-px h-6 bg-gray-200 mx-2"></div>

        <!-- Sales Tools Home -->
        <a href="{{ url_for('sales.sales_tools') }}" class="whitespace-nowrap px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.endpoint == 'sales.sales_tools' %}
                font-bold text-acdi-green bg-[#f0f9e8]
            {% else %}
                font-medium text-gray-600 hover:text-acdi-green hover:bg-gray-50
            {% endif %}">
            Sales Tools
        </a>

        {% if user.account == 'ACDI' %}
        <!-- My Accounts (Visible only to ACDI) -->
        <a href="{{ url_for('sales.rep_accounts') }}" class="whitespace-nowrap px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.endpoint == 'sales.rep_accounts' %}
                font-bold text-acdi-green bg-[#f0f9e8]
            {% else %}
                font-medium text-gray-600 hover:text-acdi-green hover:bg-gray-50
            {% endif %}">
            My Accounts
        </a>
        {% endif %}

        {% if user.account != 'ACDI'%}
        <!-- License Dashboard -->
        <a href="{{ url_for('sales.reseller_licenses') }}" class="whitespace-nowrap px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.endpoint == 'sales.reseller_licenses' %}
                font-bold text-acdi-green bg-[#f0f9e8]
            {% else %}
                font-medium text-gray-600 hover:text-acdi-green hover:bg-gray-50
            {% endif %}">
            Licenses {{session.get("active_account_id")}}
        </a>
        {% endif %}

        <!-- Open Deals -->
        <a href="{{ url_for('sales.open_deals') }}" class="whitespace-nowrap px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.endpoint == 'sales.open_deals' %}
                font-bold text-acdi-green bg-[#f0f9e8]
            {% else %}
                font-medium text-gray-600 hover:text-acdi-green hover:bg-gray-50
            {% endif %}">
            Open Deals
        </a>
     
        <!-- Shipment Tracking -->
        <a href="{{ url_for('support.shipment_tracking') }}" class="whitespace-nowrap px-4 py-2 text-sm rounded-lg transition-colors
            {% if request.endpoint == 'support.shipment_tracking' %}
                font-bold text-acdi-green bg-[#f0f9e8]
            {% else %}
                font-medium text-gray-600 hover:text-acdi-green hover:bg-gray-50
            {% endif %}">
            Shipment Tracking
        </a>
    </nav>
</section>
