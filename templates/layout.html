<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACDI Partner Portal</title>
    <!-- Favicon Integration -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Config for ACDI Branding -->
    <script>
              tailwind.config = {
                theme: {
                  extend: {
                    colors: {
                      acdi: {
                        green: '#8CC63F', /* ACDI Signature Green */
                        dark: '#1e293b'
                      }
                    }
                  }
                }
              }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <!-- Clean, white navbar to highlight the green logo -->
    <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">

                <!-- Logo and Branding (Now a clickable link back to Dashboard) -->
                <a href="/" class="flex-shrink-0 flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img src="{{ url_for('static', filename='ACDI_Logosmall.png') }}" alt="ACDI Logo" class="h-10 w-auto">
                    <span class="font-bold text-xl text-gray-800 tracking-tight border-l-2 border-gray-200 pl-4">Partner Portal</span>
                </a>

                <!-- Check for either 'email' or 'user' variables -->
                {% if email or user %}
                <div class="flex items-center space-x-6">

                    <!-- Obvious Dashboard Link -->
                    <a href="/" class="text-sm font-bold text-acdi-green hover:text-green-700 transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        Dashboard
                    </a>

                    <div class="h-6 w-px bg-gray-200 hidden sm:block"></div>

                    <!-- Display Logged In Email -->
                    <span class="text-sm font-medium text-gray-500 hidden sm:flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        {{ email | default(user) }}
                    </span>

                    <!-- With IAP, logging out requires clearing the IAP session -->
                    <a href="/logout" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-bold transition-colors border border-gray-200">Logout</a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
